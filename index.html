
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>J.C. VIP Transport - Bogotá Quest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0c1222;
        color: #f8fafc;
      }

      .font-gaming {
        font-family: 'Orbitron', sans-serif;
      }

      .gradient-gold {
        background: linear-gradient(135deg, #d9b341 0%, #b8860b 50%, #8b6508 100%);
      }

      .text-gold {
        background: linear-gradient(to right, #fde68a, #d97706);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .glass-card {
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(217, 119, 6, 0.2);
      }

      .glow-gold {
        box-shadow: 0 0 20px rgba(217, 119, 6, 0.3);
      }

      .glow-emerald {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
      }

      /* Replaced Unsplash with a professional Bogota cityscape from Pixabay */
      .bg-main-visual {
        background-image: linear-gradient(rgba(12, 18, 34, 0.96), rgba(12, 18, 34, 0.96)), url("https://cdn.pixabay.com/photo/2016/11/04/21/34/bogota-1799014_1280.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }

      .emerald-accent {
        border-left: 4px solid #10b981;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a;
      }
      ::-webkit-scrollbar-thumb {
        background: #b8860b;
        border-radius: 4px;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://esm.sh/@google/genai@^1.38.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-main-visual">
    <div id="root"></div>
  </body>
</html>
